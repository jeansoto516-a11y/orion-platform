name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate-backend:
    name: Validação — Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
          cache-dependency-path: backend/orion-backend/pom.xml

      - name: Compilar e rodar testes
        working-directory: backend/orion-backend
        run: ./mvnw clean verify -B

  validate-frontend:
    name: Validação — Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Build de produção
        working-directory: frontend
        run: npm run build

  build-images:
    name: Build — Imagens Docker
    runs-on: ubuntu-latest
    needs: [validate-backend, validate-frontend]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build imagem do backend
        run: docker build -t orion-backend:${{ github.sha }} ./backend/orion-backend

      - name: Build imagem do frontend
        run: docker build -t orion-frontend:${{ github.sha }} ./frontend

      - name: Salvar imagens como artefato
        run: |
          docker save orion-backend:${{ github.sha }} -o backend-image.tar
          docker save orion-frontend:${{ github.sha }} -o frontend-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            backend-image.tar
            frontend-image.tar
          retention-days: 1

  security-scan:
    name: Segurança — Verificação de vulnerabilidades
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Carregar imagens
        run: |
          docker load -i backend-image.tar
          docker load -i frontend-image.tar

      - name: Scan de vulnerabilidades — Backend
                uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: "orion-backend:${{ github.sha }}"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Scan de vulnerabilidades — Frontend
                uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: "orion-frontend:${{ github.sha }}"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
